<!doctype html>
<html lang="en" data-appearance="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Openings Local</title>
  <link rel="icon" href="../icons/icon48.png">
  <link rel="preload" href="fonts/Nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/"><img src="pieces/cburnett/wN.svg" alt=""><span>openings<small>local</small></span></a>
    <nav class="topnav">
      <a href="#/" data-view="courses" data-icon="learn"><span>Courses</span></a>
      <a href="#/analysis" data-view="analysis" data-icon="board"><span>Analysis Board</span></a>
      <a href="#/library" data-view="library" data-icon="library"><span>Library</span></a>

    </nav>
    <div class="line-progress"><i id="line-progress"></i></div>

      <a class="icon-btn" href="#/stats" data-view="stats" data-icon="trophy" title="Progress and records"></a>
      <a class="icon-btn" href="#/settings" data-view="settings" data-icon="settings" title="Settings"></a>
      <button class="icon-btn" id="theme-toggle" title="Dark / light theme"></button>
      <span class="streak" id="streak" data-icon="flame"><span class="n">0</span></span>
    </div>
  </header>
  <main id="main"></main>

  <script src="js/chess.js"></script>

  <script src="js/pgn.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/board.js"></script>

  <script src="js/trainer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
