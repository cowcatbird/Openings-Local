name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=openings-local-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag v$TAG does not match manifest.json version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi

      - name: Build extension zip
        run: |
          mkdir -p dist/openings-local
          cp -r manifest.json background.js app README.md CREDITS.md dist/openings-local/
          cd dist/openings-local
          zip -r -9 "../${{ steps.meta.outputs.zip }}" . -x "*.DS_Store" -x "Thumbs.db"
          cd ..
          ls -la
          unzip -l "${{ steps.meta.outputs.zip }}" | tail -n 1

      - name: Write release notes
        run: |
          cat > dist/notes.md <<'NOTES'
          ## Openings Local ${{ steps.meta.outputs.version }}

          Fully offline chess opening trainer, packaged as a Chrome extension.

          ### Install
          1. Download `${{ steps.meta.outputs.zip }}` below and unzip it.
          2. Open `chrome://extensions` and turn on **Developer mode**.
          3. Click **Load unpacked** and select the unzipped `openings-local` folder.
          4. Pin the ♞ icon and click it to open the app in a new tab.

          Works in Chrome, Edge and Brave. All data stays in the browser profile; nothing is uploaded.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/${{ steps.meta.outputs.zip }}" \
            --title "Openings Local v${{ steps.meta.outputs.version }}" \
            --notes-file dist/notes.md
