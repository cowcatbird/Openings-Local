import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def appVersion = new JsonSlurper().parse(rootProject.file('../manifest.json')).version as String
def (major, minor, patch) = appVersion.tokenize('.').collect { it as int }
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.cowcatbird.openingslocal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cowcatbird.openingslocal'
        minSdk 24
        targetSdk 35
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
    }

    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../app']
        }
    }

    lint {
        // Sideloaded, never on Play, so Play's target SDK deadline does not apply.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
}
