name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=openings-local-v$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "apk=openings-local-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag v$TAG does not match manifest.json version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi

      - name: Build extension zip
        run: |
          mkdir -p dist/openings-local
          cp -r manifest.json background.js app README.md CREDITS.md dist/openings-local/
          cd dist/openings-local
          zip -r -9 "../${{ steps.meta.outputs.zip }}" . -x "*.DS_Store" -x "Thumbs.db"
          cd ..
          ls -la
          unzip -l "${{ steps.meta.outputs.zip }}" | tail -n 1

      - name: Write release notes
        run: |
          cat > dist/notes.md <<'NOTES'
          ## Openings Local ${{ steps.meta.outputs.version }}

          Fully offline chess opening trainer for Chrome, Android and iPhone. Nothing is uploaded; progress stays on each device.

          ### Chrome, Edge or Brave
          1. Download `${{ steps.meta.outputs.zip }}` below and unzip it.
          2. Open `chrome://extensions` and turn on **Developer mode**.
          3. Click **Load unpacked** and select the unzipped `openings-local` folder.
          4. Pin the ♞ icon and click it to open the app in a new tab.

          ### Android
          1. On your phone, download `${{ steps.meta.outputs.apk }}` below.
          2. Open it. When Android asks, allow your browser to install apps.
          3. Tap **Install**, then open **Openings Local** from your home screen.

          ### iPhone or iPad
          1. Open https://cowcatbird.github.io/Openings-Local/ in Safari.
          2. Tap **Share**, then **Add to Home Screen**.
          3. Open it from your home screen. It works offline after that.

          To move progress between devices, use **Settings → Backup**: export on one device and import on the other.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/${{ steps.meta.outputs.zip }}" \
            "dist/${{ steps.meta.outputs.apk }}" \
            --title "Openings Local v${{ steps.meta.outputs.version }}" \
            --notes-file dist/notes.md
