name: Android

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android assembleRelease

      - name: Name, check and verify the APK
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          APK="openings-local-v$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if "$BUILD_TOOLS/aapt2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "The APK requests INTERNET; it must stay offline." >&2
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: openings-local-v*.apk
          if-no-files-found: error
